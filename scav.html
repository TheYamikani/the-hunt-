<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NerdAxis · The Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140913; --bg2:#1A0C18; --panel:#221324; --panel2:#2B1A2D;
    --line:#3A2236; --line2:#503048;
    --ink:#FBE7EF; --mute:#A98498; --dim:#6E4E60;
    --red:#FF2D5B; --red-d:#D71640; --red-glow:rgba(255,45,91,.45);
    --rose:#F19FC0; --rose-glow:rgba(241,159,192,.35);
    --gold:#FFD166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg);
    background-image:
      radial-gradient(circle at 88% 12%, rgba(255,45,91,.14), transparent 40%),
      radial-gradient(circle at 12% 88%, rgba(241,159,192,.08), transparent 44%),
      linear-gradient(180deg, #140913 0%, #190A18 100%);
    min-height:100vh; overflow-x:hidden; position:relative; padding-bottom:60px;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.18;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,200,220,.30) 1px, transparent 0);
    background-size:28px 28px;
    mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 80%);
  }
  /* falling sakura */
  .petal-fall{position:fixed; top:-40px; z-index:1; pointer-events:none; opacity:.55;
    animation:fall linear infinite; mix-blend-mode:screen; filter:drop-shadow(0 0 6px rgba(255,140,180,.35));}
  @keyframes fall{
    0%{transform:translateY(-60px) translateX(0) rotate(0deg)}
    100%{transform:translateY(108vh) translateX(80px) rotate(360deg)}
  }
  .blossom-svg{width:100%;height:100%;display:block}

  .wrap{position:relative; z-index:2; max-width:680px; margin:0 auto; padding:24px 22px}

  /* header */
  header{display:flex; align-items:center; gap:14px; margin-bottom:24px}
  .mark{width:54px; height:54px; flex:0 0 auto; filter:drop-shadow(0 0 18px var(--red-glow))}
  .mark img{width:100%; height:100%; display:block; object-fit:contain}
  .wm{font-family:'Russo One', sans-serif; font-size:24px; letter-spacing:1px; text-transform:uppercase; line-height:1.05}
  .wm .axis{color:var(--red); text-shadow:0 0 24px var(--red-glow)}
  .tag{margin-top:5px; font-family:'JetBrains Mono', monospace; font-size:10px;
    letter-spacing:3px; color:var(--mute); text-transform:uppercase;}
  .tag .dot{color:var(--red); margin:0 6px}

  /* progress strip */
  .progress{
    display:grid; grid-template-columns:repeat(8, 1fr); gap:6px;
    margin-bottom:24px; padding:14px;
    background:linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:0 0 0 1px rgba(241,159,192,.04) inset;
  }
  .slot{
    aspect-ratio:1; border-radius:8px;
    background:var(--bg); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Russo One', sans-serif; font-size:22px; color:var(--dim);
    transition:all .4s;
    position:relative;
  }
  .slot.filled{
    background:linear-gradient(180deg, color-mix(in srgb, var(--red) 30%, var(--panel)) 0%, var(--bg2) 100%);
    border-color:var(--red); color:var(--ink);
    box-shadow:0 0 20px var(--red-glow);
    animation:pop .5s;
  }
  @keyframes pop{0%{transform:scale(.7); opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* status / instruction line */
  .status{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:2px; color:var(--mute); text-transform:uppercase;
    text-align:center; margin-bottom:14px;
  }
  .status .num{color:var(--red); font-weight:700}

  /* clue card */
  .card{
    background:linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
    border:1px solid var(--line2); border-radius:18px;
    padding:28px 26px; margin-bottom:20px;
    box-shadow:0 0 40px rgba(0,0,0,.4), 0 0 0 1px rgba(241,159,192,.04) inset;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:28px; right:28px; height:2px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow:0 0 14px var(--red);
  }
  .card .label{
    font-family:'JetBrains Mono', monospace; font-size:10px;
    letter-spacing:3px; color:var(--red); text-transform:uppercase; margin-bottom:10px;
  }
  .clue{
    font-family:'Russo One', sans-serif; font-size:18px; line-height:1.55;
    color:var(--ink); letter-spacing:.5px;
  }
  .clue em{color:var(--rose); font-style:normal}

  /* input */
  .input-wrap{margin-top:8px}
  .input-label{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:2px; color:var(--mute); text-transform:uppercase; margin-bottom:10px; display:block;
  }
  .code-input{
    width:100%; background:var(--bg); border:1.5px solid var(--line2);
    border-radius:12px; padding:18px 14px;
    font-family:'Russo One', sans-serif; font-size:22px; color:var(--ink);
    letter-spacing:3px; text-align:center; text-transform:uppercase;
    transition:border-color .2s, box-shadow .2s; outline:none;
  }
  .code-input:focus{border-color:var(--red); box-shadow:0 0 24px var(--red-glow)}
  .code-input.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .submit{
    width:100%; margin-top:10px;
    background:var(--red); color:#fff; border:none; cursor:pointer;
    font-family:'Russo One', sans-serif; font-size:15px; padding:15px;
    border-radius:12px; letter-spacing:2px; text-transform:uppercase;
    box-shadow:0 0 26px var(--red-glow); transition:background .15s, transform .1s;
  }
  .submit:hover{background:var(--red-d)}
  .submit:active{transform:translateY(1px)}

  /* feedback */
  .feedback{
    margin-top:14px; padding:14px 16px; border-radius:10px;
    font-family:'JetBrains Mono', monospace; font-size:12px;
    letter-spacing:1.5px; text-transform:uppercase; text-align:center;
    display:none;
  }
  .feedback.show{display:block; animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .feedback.error{background:rgba(255,45,91,.12); border:1px solid var(--red); color:var(--red)}
  .feedback.warn{background:rgba(255,209,102,.10); border:1px solid var(--gold); color:var(--gold)}
  .feedback.success{background:rgba(241,159,192,.10); border:1px solid var(--rose); color:var(--rose)}

  /* action row */
  .actions{
    display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;
  }
  .btn-ghost{
    flex:1; min-width:120px; background:transparent; color:var(--mute);
    border:1px solid var(--line2); border-radius:10px; padding:10px;
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .btn-ghost:hover{border-color:var(--red); color:var(--red)}

  /* hint reveal */
  .hint-box{
    margin-top:14px; padding:14px 18px; border-radius:10px;
    background:rgba(255,209,102,.06); border:1px solid rgba(255,209,102,.4);
    font-family:'Inter', sans-serif; font-size:14px; color:var(--gold);
    display:none; line-height:1.5;
  }
  .hint-box.show{display:block; animation:fade .4s}
  .hint-box .label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:3px;
    color:var(--gold); text-transform:uppercase; margin-bottom:6px; opacity:.8;
  }

  /* assembled word display */
  .word-display{
    display:flex; gap:8px; justify-content:center; margin:20px 0;
    flex-wrap:wrap;
  }
  .word-letter{
    width:46px; height:56px; border-radius:8px;
    background:var(--bg); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Russo One', sans-serif; font-size:26px; color:var(--dim);
  }
  .word-letter.set{
    background:linear-gradient(180deg, color-mix(in srgb, var(--red) 35%, var(--panel)), var(--bg2));
    border-color:var(--red); color:var(--ink);
    box-shadow:0 0 18px var(--red-glow);
  }

  /* finale */
  .finale .clue{font-size:22px; line-height:1.5}
  .merchant-line{
    margin-top:20px; padding:18px 22px;
    background:linear-gradient(90deg, rgba(255,209,102,.10), transparent);
    border-left:3px solid var(--gold); border-radius:8px;
    font-family:'Inter', sans-serif; font-size:15px; line-height:1.6; color:var(--ink);
    font-style:italic;
  }

  @media(max-width:520px){
    .wm{font-size:20px}
    .clue{font-size:16px}
    .code-input{font-size:18px; letter-spacing:2px; padding:16px 12px}
    .word-letter{width:36px; height:46px; font-size:22px}
    .slot{font-size:18px}
  }
</style>
</head>

  // placement = position in  (1=G, 2=O, 3=D, 4=S, 5=P, 6=E, 7=E, 8=D)
  // code = what's written on the letter at that spot
  // nextClue = revealed AFTER they enter this code (or the starter for findOrder=1)
  {
    findOrder:1, letter:"D", placement:8, code:"KAMEHA", location:"30 Seconds box",
    hint:"You'll want to look where the sand runs fast. Half a minute, no more, no less.",
    nextClue:"You'll find no walls here, no cards to draw — look up where heroes hang upon the wall."
  },
  {
    findOrder:2, letter:"E", placement:7, code:"MJOLNIR", location:"behind a poster on the wall",
    hint:"Plenty of heroes watching from above, traveler. Some of them might be hiding something.",
    nextClue:"Down from the wall and into the band — guess what's on your head, but never say it aloud."
  },
  {
    findOrder:3, letter:"E", placement:6, code:"SHARINGAN", location:"Headbanz box",
    hint:"Saw a man wearing a card on his forehead the other day. Thought he'd lost his mind. Maybe you'll find yours in the same place.",
    nextClue:"Enough of guessing. Rest, weary traveler — beneath the seat where many have sat before."
  },
  {
    findOrder:4, letter:"P", placement:5, code:"MASTERBALL", location:"underside of a bench",
    hint:"My feet ache from standing. I'd sit, if I were you. And then I'd look UNDER where I sat.",
    nextClue:"Up from the bench, look around the green — find the lonely chair that no one chose."
  },
  {
    findOrder:5, letter:"S", placement:4, code:"BANKAI", location:"underside of the isolated chair",
    hint:"A lonely seat in a crowd is no seat at all. Find the one no one chose.",
    nextClue:"Every tile's a letter, every word's a fight — seek the box where 'QI' is worth eleven points. That's right."
  },
  {
    findOrder:6, letter:"D", placement:3, code:"TRIFORCE", location:"Scrabble box",
    hint:"There's a game where 'QI' is worth eleven points. Eleven! For two letters! Madness.",
    nextClue:"Step away from the table, step into the green. At the edge of your world, where the boundary's seen."
  },
  {
    findOrder:7, letter:"O", placement:2, code:"NANOMACHINES", location:"perimeter (fence/tree/farthest chair)",
    hint:"Every kingdom has a border, traveler. Even this one. Walk to the edge.",
    nextClue:"Live, laugh, and — wait, that's not quite right. Find the game that twists the saying out of sight."
  },
  {
    findOrder:8, letter:"G", placement:1, code:"PLUSULTRA", location:"Live Laugh Lose box",
    hint:"Live, laugh — bah! I never trusted those wooden signs people hang in their homes.",
    nextClue:null  // final
  },
];

const STARTER_CLUE = "Half a minute is all you'll need to begin — the first piece waits inside the box where time runs thin.";

const FINALE_MERCHANT = "The word is whole, traveler. GODSPEED — an old blessing for those setting out on a road they don't yet know. Find the man in the Killua cosplay, show him this screen, and speak the word aloud. He'll know what to do.";

// =============================================================

const STORAGE_KEY = 'hunt-progress-v1';

function loadProgress(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {found:0, hintsUsedFor:[]};
    return JSON.parse(raw);
  } catch(e) { return {found:0, hintsUsedFor:[]}; }
}
function saveProgress(p){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e){}
}

let state = loadProgress();

// build cherry blossom petals
(function petals(){
  function blossomSVG(petal, center){
    let g = '<g>';
    for(let k=0;k<5;k++){const a=k*72; g += `<ellipse cx="50" cy="30" rx="13" ry="20" fill="${petal}" transform="rotate(${a} 50 50)"/>`;}
    g += `<circle cx="50" cy="50" r="7" fill="${center}"/></g>`;
    return g;
  }
  const tints=[{p:"#F7C5DA", c:"#E0518A"},{p:"#FFA8C8", c:"#FF2D5B"},{p:"#F19FC0", c:"#C9184A"}];
  for(let i=0;i<14;i++){
    const d=document.createElement('div'); d.className='petal-fall';
    const size=12 + Math.random()*22;
    d.style.left = Math.random()*100 + 'vw';
    d.style.width = size+'px'; d.style.height = size+'px';
    d.style.animationDuration = (10 + Math.random()*10) + 's';
    d.style.animationDelay = (-Math.random()*14) + 's';
    const t = tints[i%tints.length];
    d.innerHTML = `<svg viewBox="0 0 100 100" class="blossom-svg">${blossomSVG(t.p, t.c)}</svg>`;
    document.body.appendChild(d);
  }
})();

// render the progress strip + word display
function renderProgress(){
  const prog = document.getElementById('progress');
  // placement order 1..8 → letters G O D S P E E D
  const sequence = [];
  for(let pl=1; pl<=8; pl++){
    const L = LETTERS.find(x=>x.placement===pl);
    // is it found? a letter is "found" if findOrder <= state.found
    const isFound = L.findOrder <= state.found;
    sequence.push({letter:L.letter, found:isFound});
  }
  prog.innerHTML = sequence.map(s=>
    `<div class="slot ${s.found?'filled':''}">${s.found?s.letter:''}</div>`
  ).join('');

  const wd = document.getElementById('wordDisplay');
  wd.innerHTML = sequence.map(s=>
    `<div class="word-letter ${s.found?'set':''}">${s.found?s.letter:'_'}</div>`
  ).join('');

  document.getElementById('counter').textContent = state.found;
}

// show clue for the next letter to find
function renderClue(){
  const card = document.getElementById('mainCard');
  const label = document.getElementById('cardLabel');
  const clue = document.getElementById('clueText');
  const inputWrap = document.getElementById('inputWrap');
  const hintBtn = document.getElementById('hintBtn');
  const hintBox = document.getElementById('hintBox');
  hintBox.classList.remove('show');

  if(state.found === 0){
    label.textContent = "YOUR FIRST CLUE";
    clue.textContent = STARTER_CLUE;
    inputWrap.style.display = '';
    card.classList.remove('finale');
    hintBtn.style.display = '';
  } else if(state.found < 8){
    // they've found `state.found` letters, looking for the next
    const prevLetter = LETTERS.find(x=>x.findOrder===state.found);
    label.textContent = `CLUE ${state.found+1} OF 8`;
    clue.textContent = prevLetter.nextClue;
    inputWrap.style.display = '';
    card.classList.remove('finale');
    hintBtn.style.display = '';
  } else {
    // done!
    label.textContent = "THE BLESSING";
    clue.innerHTML = '<em>You have spoken the word.</em> The letters fall into place: <strong>GODSPEED</strong> — an old traveler\'s blessing. Now seek the man in the Killua cosplay.';
    inputWrap.style.display = 'none';
    hintBtn.style.display = 'none';
    card.classList.add('finale');
    // add merchant line if not already
    if(!card.querySelector('.merchant-line')){
      const m = document.createElement('div');
      m.className = 'merchant-line';
      m.textContent = FINALE_MERCHANT;
      card.insertBefore(m, card.querySelector('.actions'));
    }
  }
}

function showFeedback(type, msg){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + type;
  fb.textContent = msg;
  setTimeout(()=>fb.classList.remove('show'), 3500);
}

function submitCode(){
  const input = document.getElementById('codeInput');
  const code = input.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code){ input.focus(); return; }

  if(state.found >= 8){ showFeedback('warn','The hunt is complete, traveler.'); return; }

  // expected code is for the NEXT letter to find
  const nextLetter = LETTERS.find(x=>x.findOrder === state.found+1);

  if(code === nextLetter.code){
    state.found = state.found + 1;
    saveProgress(state);
    input.value = '';
    renderProgress();
    renderClue();
    if(state.found < 8){
      showFeedback('success', `LETTER ${nextLetter.letter} CLAIMED · NEXT CLUE UNLOCKED`);
    } else {
      showFeedback('success', '✦ ALL 8 LETTERS CLAIMED · GODSPEED ✦');
    }
  } else {
    // is this a code for a letter the player has already found?
    const alreadyFound = LETTERS.find(x=>x.code===code && x.findOrder <= state.found);
    if(alreadyFound){
      showFeedback('warn', `YOU'VE ALREADY CLAIMED LETTER ${alreadyFound.letter}`);
    } else {
      // is it a code for a future letter (out of order)?
      const future = LETTERS.find(x=>x.code===code && x.findOrder > state.found+1);
      if(future){
        showFeedback('warn', 'NOT YET — FOLLOW THE CLUE IN ORDER');
      } else {
        showFeedback('error', 'WRONG CODE · TRY AGAIN');
      }
    }
    input.classList.add('shake');
    setTimeout(()=>input.classList.remove('shake'), 400);
  }
}

document.getElementById('submitBtn').addEventListener('click', submitCode);
document.getElementById('codeInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') submitCode();
});

document.getElementById('hintBtn').addEventListener('click', ()=>{
  const nextLetter = LETTERS.find(x=>x.findOrder === state.found+1);
  if(!nextLetter) return;
  const hintBox = document.getElementById('hintBox');
  const hintText = document.getElementById('hintText');
  hintText.textContent = `"${nextLetter.hint}"`;
  hintBox.classList.add('show');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm("Start the hunt over from the beginning? Your progress will be erased.")) return;
  state = {found:0, hintsUsedFor:[]};
  saveProgress(state);
  // remove any merchant line from a previous finale
  const card = document.getElementById('mainCard');
  const m = card.querySelector('.merchant-line'); if(m) m.remove();
  renderProgress(); renderClue();
});

// initial render
renderProgress();
renderClue();
</script>
</body>
</html>
